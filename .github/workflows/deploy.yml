
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]        # must match the `name:` in ci.yml exactly
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,TAG
          script: |
            cd /opt/goapp
            git pull
            if make deploy; then
              echo "Deploy succeeded."
            else
              echo "Deploy failed health check — ensuring previous working version is running..."
              make rollback || echo "WARNING: rollback failed, manual intervention required."
              exit 1
            fi
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          TAG: ${{ github.event.workflow_run.head_sha }}
